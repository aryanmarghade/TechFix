<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — TechFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 2rem;
      margin: 2.5rem 0 4rem 0;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 90px 1fr auto auto;
      align-items: center;
      gap: 1.5rem;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item img {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .summary-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 100px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      font-size: 0.95rem;
      color: var(--text-main);
    }
    .summary-total {
      border-top: 2px dashed var(--border);
      padding-top: 1rem;
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--dark);
    }
    @media (max-width: 860px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
      .cart-item {
        grid-template-columns: 80px 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-main">
      <a href="/index.html" class="logo">
        <span class="logo-badge">TF</span>
        <span>TECH<span class="text-fix">FIX</span></span>
      </a>

      <div class="search-box">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="global-search-input" placeholder="Search laptops, SSDs, PCs, pen drives...">
      </div>

      <div class="header-actions">
        <a href="/login.html" id="header-account-link" class="action-btn">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Account</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 style="font-size: 2rem; font-weight: 800; margin-top: 2rem;">Shopping Cart</h1>

    <div id="cart-content-wrapper">
      <!-- Dynamic cart contents or empty placeholder -->
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    function renderCart() {
      const cart = TechFix.getCart();
      const wrapper = document.getElementById('cart-content-wrapper');

      if (!cart || cart.length === 0) {
        wrapper.innerHTML = `
          <div style="text-align: center; padding: 4rem 1rem; background: #fff; border-radius: var(--radius-lg); border: 1px dashed var(--border); margin: 2rem 0 4rem 0;">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">🛒</div>
            <h2>Your Cart is Empty</h2>
            <p style="color: var(--text-muted); margin: 0.5rem 0 1.5rem 0;">Browse our laptops, pre-built PCs, storage, or create a custom build.</p>
            <a href="/shop.html" class="btn btn-primary btn-lg">Explore Hardware Store</a>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      const itemsHtml = cart.map((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        return `
          <div class="cart-item">
            <img src="${item.image_url}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=200&auto=format&fit=crop&q=80'">
            <div>
              <div style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">${item.brand || 'TechFix'}</div>
              <a href="${item.slug ? `/product.html?slug=${item.slug}` : '#'}" style="font-weight: 700; color: var(--dark); font-size: 1rem;">${item.name}</a>
              ${item.custom_build_details ? `<div style="font-size: 0.8rem; color: #15803d; font-weight: 600; margin-top: 0.2rem;">✨ Verified Custom PC Build (Includes Assembly & Benchmarking)</div>` : ''}
              <div style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.35rem;">
                Unit Price: <strong>${TechFix.formatPrice(item.price)}</strong>
              </div>
            </div>

            <div style="display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;">
              <button style="padding: 0.4rem 0.75rem; background: #f8fafc; border: none; cursor: pointer; font-weight: 700;" onclick="changeItemQty(${index}, ${item.quantity - 1})">-</button>
              <span style="padding: 0.4rem 0.75rem; font-weight: 700; min-width: 32px; text-align: center;">${item.quantity}</span>
              <button style="padding: 0.4rem 0.75rem; background: #f8fafc; border: none; cursor: pointer; font-weight: 700;" onclick="changeItemQty(${index}, ${item.quantity + 1})">+</button>
            </div>

            <div style="text-align: right;">
              <div style="font-weight: 800; font-size: 1.1rem; color: var(--dark);">${TechFix.formatPrice(itemTotal)}</div>
              <button style="background: none; border: none; color: var(--danger); font-size: 0.8rem; cursor: pointer; margin-top: 0.4rem; text-decoration: underline;" onclick="TechFix.removeFromCart(${index}); renderCart();">
                Remove
              </button>
            </div>
          </div>
        `;
      }).join('');

      const deliveryFee = subtotal >= 999 ? 0 : 99;
      const total = subtotal + deliveryFee;

      wrapper.innerHTML = `
        <div class="cart-layout">
          <!-- Item List -->
          <div style="background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 2px solid var(--border);">
              <span style="font-weight: 700; color: var(--text-muted);">Product</span>
              <span style="font-weight: 700; color: var(--text-muted);">Subtotal</span>
            </div>
            ${itemsHtml}
            <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
              <a href="/shop.html" class="btn btn-outline btn-sm">← Continue Shopping</a>
              <button class="btn btn-outline btn-sm" style="color: var(--danger);" onclick="TechFix.clearCart(); renderCart();">Clear Cart</button>
            </div>
          </div>

          <!-- Summary Box -->
          <div class="summary-card">
            <h3 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 1.25rem;">Order Summary</h3>
            <div class="summary-row">
              <span>Items Subtotal:</span>
              <strong>${TechFix.formatPrice(subtotal)}</strong>
            </div>
            <div class="summary-row">
              <span>Estimated Delivery:</span>
              <strong>${deliveryFee === 0 ? '<span style="color: var(--success);">FREE</span>' : TechFix.formatPrice(deliveryFee)}</strong>
            </div>
            <div class="summary-row" style="font-size: 0.85rem; color: var(--text-muted);">
              <span>Payment Option:</span>
              <strong style="color: var(--primary);">Cash On Delivery (COD)</strong>
            </div>

            <div class="summary-total">
              <span>Grand Total:</span>
              <span>${TechFix.formatPrice(total)}</span>
            </div>

            <a href="/checkout.html" class="btn btn-accent btn-lg btn-block" style="margin-top: 1.5rem;">
              Proceed to COD Checkout →
            </a>

            <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
              🔒 100% Cash On Delivery. Pay cash to our courier upon doorstep inspection.
            </div>
          </div>
        </div>
      `;
    }

    function changeItemQty(index, qty) {
      TechFix.updateCartQuantity(index, qty);
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
