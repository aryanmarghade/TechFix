<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration — TechFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-main">
      <a href="/index.html" class="logo">
        <span class="logo-badge">TF</span>
        <span>TECH<span class="text-fix">FIX</span></span>
      </a>
    </div>
  </header>

  <main class="container" style="max-width: 480px; margin: 4rem auto 6rem auto;">
    <div style="background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem; text-align: center;">
        Create TechFix Account
      </h1>
      <p style="color: var(--text-muted); font-size: 0.875rem; text-align: center; margin-bottom: 2rem;">
        Join TechFix for fast checkout, saved PC builds & repair status updates
      </p>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aryan Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="e.g. aryan@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. 9820123456" pattern="[0-9]{10}" required>
          <div class="form-hint">10-digit mobile number for order delivery coordination</div>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter your password" minlength="6" required>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-accent btn-block btn-lg" style="margin-top: 1.25rem;">
          Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        TechFix.showToast('Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password, confirmPassword })
        });

        const data = await res.json();
        if (data.success) {
          TechFix.setAuth(data.user, data.token);
          TechFix.showToast('Account registered successfully!', 'success');
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect');
          setTimeout(() => {
            if (redirectUrl) {
              window.location.href = redirectUrl;
            } else {
              window.location.href = '/account.html';
            }
          }, 600);
        } else {
          TechFix.showToast(data.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Register Account';
        }
      } catch (err) {
        console.error('Registration error:', err);
        TechFix.showToast('Registration failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Register Account';
      }
    }
  </script>
</body>
</html>
