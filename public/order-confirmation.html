<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — TechFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-main">
      <a href="/index.html" class="logo">
        <span class="logo-badge">TF</span>
        <span>TECH<span class="text-fix">FIX</span></span>
      </a>
    </div>
  </header>

  <main class="container" style="max-width: 680px; margin: 3.5rem auto;">
    <div style="background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 3rem 2.5rem; text-align: center; box-shadow: var(--shadow-md);">
      <div style="width: 70px; height: 70px; background: var(--success-bg); color: var(--success); font-size: 2.2rem; font-weight: 800; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
        ✓
      </div>

      <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">
        Order Placed Successfully!
      </h1>
      <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.5; margin-bottom: 2rem;">
        Thank you for shopping at TechFix. Your Cash On Delivery order has been registered in our system and is being packed.
      </p>

      <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 2rem; text-align: left;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
          <span style="color: var(--text-muted);">Order Reference Number:</span>
          <strong id="confirm-order-number" style="color: var(--primary);">TF-ORD-...</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
          <span style="color: var(--text-muted);">Payment Mode:</span>
          <strong>Cash On Delivery (COD)</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">Status:</span>
          <span class="badge badge-success">Order Placed</span>
        </div>
      </div>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a id="track-order-btn" href="/track-order.html" class="btn btn-primary btn-lg">Track Order Status</a>
        <a href="/shop.html" class="btn btn-outline btn-lg">Continue Shopping</a>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ordNum = urlParams.get('orderNumber');
      if (ordNum) {
        document.getElementById('confirm-order-number').textContent = ordNum;
        document.getElementById('track-order-btn').href = `/track-order.html?orderNumber=${ordNum}`;
      }
    });
  </script>
</body>
</html>
