<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — TechFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-main">
      <a href="/index.html" class="logo">
        <span class="logo-badge">TF</span>
        <span>TECH<span class="text-fix">FIX</span></span>
      </a>
    </div>
  </header>

  <main class="container" style="max-width: 440px; margin: 4rem auto 6rem auto;">
    <div style="background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem; text-align: center;">
        Sign In to TechFix
      </h1>
      <p style="color: var(--text-muted); font-size: 0.875rem; text-align: center; margin-bottom: 2rem;">
        Track orders, view saved custom PC builds & manage repairs
      </p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address or Phone Number</label>
          <input type="text" id="login-identifier" class="form-control" placeholder="e.g. aryan@example.com or admin@techfix.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.25rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
        Don't have an account yet? <a href="/register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>

      <div style="background: #f8fafc; border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 0.85rem; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
        <strong>Demo Credentials:</strong><br>
        • Customer: <code>aryan@example.com</code> / <code>customer123</code><br>
        • Admin: <code>admin@techfix.com</code> / <code>admin123</code>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const identifier = document.getElementById('login-identifier').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        if (data.success) {
          TechFix.setAuth(data.user, data.token);
          TechFix.showToast('Login successful!', 'success');
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect');
          setTimeout(() => {
            if (redirectUrl) {
              window.location.href = redirectUrl;
            } else if (data.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/account.html';
            }
          }, 600);
        } else {
          TechFix.showToast(data.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        console.error('Login error:', err);
        TechFix.showToast('Server connection failed.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
